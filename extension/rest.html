<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time to rest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="rest">
  <main class="box">
    <h1 id="title">Time to rest</h1>
    <p id="sub" class="muted"></p>
    <div id="clock" class="timer" aria-live="off">00:00</div>
    <ul id="tips" class="tips"></ul>
    <div class="row">
      <button id="more" type="button">10 more minutes of focus</button>
      <button id="skip" type="button">Skip this rest</button>
    </div>
  </main>
  <script src="shared.js"></script>
  <script src="rest.js"></script>
</body>
</html>
